name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Security problems don't belong here:** report them privately from the repository's Security tab, under "Report a vulnerability".
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release or commit you're running.
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Where does it run?
      options:
        - Self-hosted (Docker)
        - Self-hosted (from source)
        - Hosted by Ten98
        - Library used in another app
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node.js and database versions, where relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove passwords, keys, tokens and personal data first.
