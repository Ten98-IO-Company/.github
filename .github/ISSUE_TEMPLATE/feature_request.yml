name: Feature request
description: Suggest something new or a change to how something works.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For open-ended ideas or questions, start a thread in the repository's **Discussions** tab instead.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who is affected, and what do they have to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Links, examples from other tools, screenshots.
